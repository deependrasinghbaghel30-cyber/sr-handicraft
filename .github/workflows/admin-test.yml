name: admin-test
on:
  push:
    branches: [ci-test]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Test
        run: |
          cd .citest && npm install --no-audit --no-fund > /dev/null 2>&1 && npx playwright install --with-deps chromium > /dev/null 2>&1
          cd .. && mkdir -p /tmp/site && cp -r *.html *.js *.jpg *.png manifest.json /tmp/site/
          sed -i 's/projectId: "",/projectId: "demo-sr",/; s/apiKey: "",/apiKey: "fake",/; s/authDomain: "",/authDomain: "demo-sr.firebaseapp.com",/' /tmp/site/admin.html
          sed -i 's/const LIVE = { projectId: "", apiKey: "" };/const LIVE = { projectId: "demo-sr", apiKey: "fake" };/' /tmp/site/index.html
          (cd /tmp/site && python3 -m http.server 4000 --bind 127.0.0.1 > /dev/null 2>&1 &)
          cp firestore.rules .citest/firestore.rules
          cd .citest && npx firebase emulators:exec --only auth,firestore --project demo-sr "node test.mjs" > out.txt 2>&1 || true
          cat out.txt | tail -40
          python3 -c "
          t=open('out.txt',errors='replace').read(); i=t.find('SR ADMIN:'); b=t[i:] if i>=0 else t[-6000:]
          print('::error title=T::'+b.replace('%','%25').replace('\n','%0A')[:7000])"
      - name: shots
        if: always()
        run: |
          mkdir -p .citest/shots && cd .citest/shots && git init -q && git checkout -q -b shots-admin && git config user.email ci@x && git config user.name ci && git add -A && git commit -qm s && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots-admin
