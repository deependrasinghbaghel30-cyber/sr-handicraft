*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--rose)}
.top{position:sticky;top:0;z-index:20;background:var(--rose);color:#fff;padding:10px 14px calc(10px) 14px;display:flex;align-items:center;gap:10px}

.top button,.top a{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px;text-decoration:none;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:19}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:13px}
.tabs button.on{background:var(--rose);border-color:var(--rose);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--rose);color:#fff}
.btn.ghost{background:#fff;color:var(--rose);border:1px solid var(--rose)}
.btn.sm{padding:7px 11px;font-size:13px}

textarea.i{min-height:90px;resize:vertical}

<!-- install as app -->
<script>
(function(){
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if ('serviceWorker' in navigator && window.isSecureContext) {
    addEventListener('load', function(){ navigator.serviceWorker.register('/admin-sw.js', { scope: '/admin' }).catch(function(){}); });
  }
  if (standalone) return;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) document.documentElement.classList.add('is-ios');
  window.__install = null;
  addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__install = e; document.documentElement.classList.add('can-install'); });
  addEventListener('appinstalled', function(){ window.__install = null; document.documentElement.classList.remove('can-install'); });
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('.inst'); if (!b || !window.__install) return;
    e.preventDefault(); var p = window.__install; window.__install = null; document.documentElement.classList.remove('can-install');
    p.prompt(); p.userChoice.catch(function(){});
  });
})();
</script>

/* ================= PHOTO UPLOAD (Cloudinary) ================= */
function shrink(file, max = 1600, q = 0.82){
  return new Promise(res => {
    if (!/^image\//.test(file.type) || file.type === "image/gif") return res(file);
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); res(b && b.size < file.size ? b : file); }, "image/jpeg", q);
    };
    im.onerror = () => { URL.revokeObjectURL(url); res(file); };   // e.g. HEIC on Android — Cloudinary converts it
    im.src = url;
  });
}
async function uploadPhoto(file){
  const blob = await shrink(file);
  const fd = new FormData();
  fd.append("file", blob, (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg");
  fd.append("upload_preset", CLOUD.preset);
  fd.append("folder", CLOUD.folder);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD.name}/image/upload`, { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.secure_url) throw new Error(j?.error?.message || "Photo upload failed — check the internet and try again.");
  // serve a web-sized, auto-format copy (smaller and faster for visitors)
  return j.secure_url.replace("/upload/", "/upload/f_auto,q_auto,w_1400,c_limit/");
}
async function uploadMany(files, onEach){
  const out = [];
  for (let i = 0; i < files.length; i++) { onEach?.(i + 1, files.length); out.push(await uploadPhoto(files[i])); }
  return out;
}
const pickFiles = (multiple = true) => new Promise(res => {
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.multiple = multiple;
  i.onchange = () => res([...(i.files || [])]); i.click();
});

  S.config = cf.exists() ? cf.data() : null;
}
const cats = () => (S.config?.cats?.length ? S.config.cats : CATS);
function allSubs(){ const out=[]; cats().forEach(c => c.groups.forEach(g => { (g.subs.length ? g.subs : [g.name]).forEach(s => out.push({ cat:c.key, catName:c.name, group:g.name, sub:s })); })); return out; }
const photosOf = k => (S.config?.photos?.[k]) || [];

onAuthStateChanged(auth, async u => {
  if (!u) { S.me = null; return renderLogin(); }

});

                  : `<p class="hint">No products yet. Ask the owner to import the current website, or add your first product.</p>`}</div>` : ""}
    <div class="row" style="margin-bottom:12px">
      <button class="btn" id="addp">+ Add product</button>

    </div>

    <div class="plist">${list.map(p => `<button class="pc" data-id="${p.id}">

  $("#addp").onclick = () => editProduct(null);

  if ($("#imp")) $("#imp").onclick = importSite;
}

function editProduct(orig){
  const isNew = !orig;
  const subs = allSubs();
  const p = orig ? clone(orig) : { name: "", price: "", material: "Sheesham Wood", size: "", desc: "", img: [], featured: false, hidden: false, cat: subs[0]?.cat, sub: subs[0]?.sub };
  const sh = document.createElement("div"); sh.className = "sheet"; document.body.appendChild(sh);
  const close = () => { sh.remove(); foot.remove(); };
  const foot = document.createElement("div"); foot.className = "foot";
  foot.innerHTML = `${isNew ? "" : `<button class="btn red" id="pdel" style="margin-right:auto">Delete</button>`}<button class="btn ghost" id="pcan">Cancel</button><button class="btn" id="psave">Save</button>`;
  document.body.appendChild(foot);
  const draw = () => {
    sh.innerHTML = `<div class="hd"><h2>${isNew ? "Add product" : "Edit product"}</h2><button class="btn ghost sm" id="px">Close</button></div>
    <main>
      <div class="card">
        <label class="f"><span>Product name *</span><input class="i" id="pn" value="${esc(p.name)}" placeholder="e.g. Sheesham 4 Door Wardrobe"></label>
        <div class="grid2">
          <label class="f"><span>Category *</span><select class="i" id="ps">${subs.map(s=>`<option value="${esc(s.cat)}|${esc(s.sub)}" ${p.cat===s.cat&&p.sub===s.sub?"selected":""}>${esc(s.catName)} › ${esc(s.sub)}</option>`).join("")}</select></label>
          <label class="f"><span>Price (₹) *</span><input class="i" id="pp" inputmode="numeric" value="${esc(p.price)}" placeholder="45999"></label>
          <label class="f"><span>Material</span><input class="i" id="pm" value="${esc(p.material)}"></label>
          <label class="f"><span>Size (optional)</span><input class="i" id="pz" value="${esc(p.size||"")}" placeholder="e.g. 78 x 72 in, height 40 in"></label>
        </div>
        <p class="hint">Category missing? Add it in the <b>Categories</b> tab, then come back.</p>
        <label class="f"><span>Description (optional)</span><textarea class="i" id="pd" placeholder="Anything special — carving, storage, finish options…">${esc(p.desc||"")}</textarea></label>
      </div>
      <div class="card">
        <div class="sec"><h3>Photos</h3><p class="hint">First photo is the main photo. Use ← → to change the order.</p></div>
        <div class="thumbs">${(p.img||[]).map((u,i)=>`<div class="tb"><div class="im" style="background-image:url('${esc(u)}')"></div><span class="no">${i+1}</span>
          <div class="ctl"><button data-mv="${i}|-1" ${i?"":"disabled"}>←</button><button data-mv="${i}|1" ${i===p.img.length-1?"disabled":""}>→</button><button class="x" data-rm="${i}">✕</button></div></div>`).join("")}
          <button class="add" id="padd"><b>+</b>Add photos</button></div>
        <div class="prog" id="pprog"></div>
      </div>
      <div class="card">
        <label class="sw"><input type="checkbox" id="pf" ${p.featured?"checked":""}><span><b>Featured</b> — show this product first on the home page</span></label>
        <label class="sw"><input type="checkbox" id="ph" ${p.hidden?"checked":""}><span><b>Hide from website</b> — sold out or not available</span></label>
      </div>
    </main>`;
    const keep = () => { p.name=$("#pn").value; const [c,s]=$("#ps").value.split("|"); p.cat=c; p.sub=s; p.price=$("#pp").value.replace(/[^0-9]/g,""); p.material=$("#pm").value; p.size=$("#pz").value; p.desc=$("#pd").value; p.featured=$("#pf").checked; p.hidden=$("#ph").checked; };
    $("#px").onclick = close;
    sh.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { keep(); const [i,d]=b.dataset.mv.split("|").map(Number); const a=p.img; [a[i],a[i+d]]=[a[i+d],a[i]]; draw(); });
    sh.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { keep(); if (confirm("Remove this photo?")) { p.img.splice(+b.dataset.rm,1); draw(); } });
    $("#padd").onclick = async () => {
      keep(); const files = await pickFiles(true); if (!files.length) return;
      const pr = $("#pprog"); $("#psave").disabled = true;
      try { const urls = await uploadMany(files, (i,n)=>pr.textContent=`Uploading photo ${i} of ${n}…`); p.img = [...(p.img||[]), ...urls]; draw(); toast(`${urls.length} photo(s) added — tap Save`); }
      catch (e) { pr.textContent = ""; alert(e.message); } finally { const sv = $("#psave"); if (sv) sv.disabled = false; }
    };
    sh._keep = keep;
  };
  draw();
  $("#pcan").onclick = close;
  $("#psave").onclick = async () => {
    sh._keep();
    if (p.name.trim().length < 3) return alert("Write the product name.");
    if (!(+p.price > 0)) return alert("Enter the price in rupees (numbers only).");
    if (!p.sub) return alert("Choose the category.");
    if (!(p.img||[]).length && !confirm("This product has no photo. Save anyway?")) return;
    const btn = $("#psave"); btn.disabled = true; btn.textContent = "Saving…";
    try {
      const id = isNew ? Math.max(0, ...S.products.map(x=>x.id), ...P.map(x=>x.id)) + 1 : p.id;
      const order = isNew ? Math.min(0, ...S.products.map(x=>x.order ?? 0)) - 1 : (p.order ?? 0);
      const data = { id, name: p.name.trim(), cat: p.cat, sub: p.sub, price: +p.price, material: (p.material||"Sheesham Wood").trim(), size: (p.size||"").trim(), desc: (p.desc||"").trim(),
        img: p.img||[], featured: !!p.featured, hidden: !!p.hidden, order, type: p.type || typeFor(p.sub), color: p.color || "#7A4A2C", updatedAt: serverTimestamp() };
      await setDoc(doc(db, "products", String(id)), data);
      const i = S.products.findIndex(x=>x.id===id); const row = { ...data, updatedAt: null };
      if (i >= 0) S.products[i] = row; else S.products.unshift(row);
      close(); toast(isNew ? "Product added — live on the website" : "Saved — live on the website"); viewProducts();
    } catch (e) { alert("Could not save: " + (e.message || e)); btn.disabled = false; btn.textContent = "Save"; }
  };
  if ($("#pdel")) $("#pdel").onclick = async () => {
    if (!confirm(`Delete "${orig.name}" from the website? This cannot be undone.`)) return;
    try { await deleteDoc(doc(db, "products", String(orig.id))); S.products = S.products.filter(x=>x.id!==orig.id); close(); toast("Deleted"); viewProducts(); }
    catch (e) { alert("Could not delete: " + (e.message || e)); }
  };
}

/* ================= WEBSITE PHOTOS ================= */
function viewPhotos(){
  const m = $("#main");
  if (!S.config) { m.innerHTML = `<div class="card"><p class="hint">Import the current website first (Products tab).</p></div>`; return; }
  const draft = { photos: clone(S.config.photos || {}), customWork: clone(S.config.customWork || []) };
  let dirty = false;
  const box = (key, title, tip, list, caps) => `<div class="card sec" data-key="${key}">
      <h3>${esc(title)}</h3>${tip?`<p class="hint">${esc(tip)}</p>`:'<p class="hint"></p>'}
      <div class="thumbs">${list.map((u,i)=>`<div class="tb"><div class="im" style="background-image:url('${esc(caps?u.src:u)}')"></div><span class="no">${i+1}</span>
        <div class="ctl"><button data-mv="${key}|${i}|-1" ${i?"":"disabled"}>←</button><button data-mv="${key}|${i}|1" ${i===list.length-1?"disabled":""}>→</button><button class="x" data-rm="${key}|${i}">✕</button></div>
        ${caps?`<input class="cap" data-cap="${i}" value="${esc(u.cap||"")}" placeholder="Caption">`:""}</div>`).join("")}
        <button class="add" data-add="${key}"><b>+</b>Add</button></div><div class="prog" data-prog="${key}"></div></div>`;
  const draw = () => {
    m.innerHTML = `<p class="hint">Photos for the fixed parts of the website. Product photos are added inside each product.</p>
      ${box("customWork","Custom Furniture page → 'Custom work we have made'","Photos of furniture made to order, with a short caption each.",draft.customWork,true)}
      ${SPOTS.map(([k,t,tip])=>box(k,t,tip,draft.photos[k]||[],false)).join("")}`;
    const listOf = k => k === "customWork" ? draft.customWork : (draft.photos[k] = draft.photos[k] || []);
    m.querySelectorAll("[data-cap]").forEach(inp => inp.oninput = () => { draft.customWork[+inp.dataset.cap].cap = inp.value; mark(); });
    m.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const [k,i,d]=b.dataset.mv.split("|"); const a=listOf(k), x=+i, y=x+(+d); [a[x],a[y]]=[a[y],a[x]]; mark(); draw(); });
    m.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const [k,i]=b.dataset.rm.split("|"); if(confirm("Remove this photo from here?")){ listOf(k).splice(+i,1); mark(); draw(); } });
    m.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => {
      const k = b.dataset.add, files = await pickFiles(true); if (!files.length) return;
      const pr = m.querySelector(`[data-prog="${k}"]`);
      try { const urls = await uploadMany(files,(i,n)=>pr.textContent=`Uploading ${i} of ${n}…`);
        urls.forEach(u => listOf(k).push(k==="customWork" ? { src:u, cap:"" } : u)); mark(); draw(); toast("Added — tap Save changes"); }
      catch (e) { pr.textContent = ""; alert(e.message); }
    });
  };
  const foot = document.createElement("div"); foot.className = "foot"; foot.style.display = "none";
  foot.innerHTML = `<span class="hint" style="margin:auto auto auto 0">Unsaved changes</span><button class="btn" id="phs">Save changes</button>`;
  document.body.appendChild(foot);
  const mark = () => { dirty = true; foot.style.display = "flex"; };
  $("#phs").onclick = async () => {
    const b = $("#phs"); b.disabled = true; b.textContent = "Saving…";
    try {
      const customWork = draft.customWork.map(x => ({ src: x.src, cap: (x.cap||"").trim() }));
      await setDoc(doc(db, "site", "config"), { photos: draft.photos, customWork, updatedAt: serverTimestamp() }, { merge: true });
      S.config = { ...S.config, photos: draft.photos, customWork }; dirty = false; foot.style.display = "none"; toast("Saved — live on the website");
    } catch (e) { alert("Could not save: " + (e.message || e)); } finally { b.disabled = false; b.textContent = "Save changes"; }
  };
  const obs = new MutationObserver(() => { if (!document.body.contains(m) || S.tab !== "photos") { foot.remove(); obs.disconnect(); } });
  obs.observe(document.body, { childList: true, subtree: true });
  window.onbeforeunload = () => dirty ? "You have unsaved changes" : undefined;
  draw();
}

/* ================= CATEGORIES ================= */
function viewCats(){
  const m = $("#main");
  if (!S.config) { m.innerHTML = `<div class="card"><p class="hint">Import the current website first (Products tab).</p></div>`; return; }
  const draft = clone(cats());
  const used = s => S.products.some(p => p.sub === s);
  const draw = () => {
    m.innerHTML = `<p class="hint">Categories shown in the website menu. A category appears on the website once it has at least one product.</p>
    ${draft.map((c,ci)=>`<div class="card"><h3 style="margin:0 0 8px">${esc(c.name)}</h3>
      ${c.groups.map((g,gi)=>`<div style="margin:0 0 12px"><b>${esc(g.name)}</b><div>${g.subs.map((s,si)=>`<span class="chip">${esc(s)}${used(s)?"":`<button data-rs="${ci}|${gi}|${si}" title="Remove">✕</button>`}</span>`).join("")}</div>
        <div class="row" style="margin-top:6px"><input class="i" data-ns="${ci}|${gi}" placeholder="New sub-category in ${esc(g.name)}, e.g. Wardrobes" style="flex:1;min-width:180px"><button class="btn ghost sm" data-as="${ci}|${gi}">Add</button></div></div>`).join("")}
      <div class="row"><input class="i" data-ng="${ci}" placeholder="New group in ${esc(c.name)}, e.g. Wardrobes" style="flex:1;min-width:180px"><button class="btn ghost sm" data-ag="${ci}">Add group</button></div>
    </div>`).join("")}
    <button class="btn" id="csave">Save categories</button>`;
    m.querySelectorAll("[data-rs]").forEach(b => b.onclick = () => { const [c,g,s]=b.dataset.rs.split("|").map(Number); draft[c].groups[g].subs.splice(s,1); draw(); });
    m.querySelectorAll("[data-as]").forEach(b => b.onclick = () => { const [c,g]=b.dataset.as.split("|").map(Number); const v=m.querySelector(`[data-ns="${c}|${g}"]`).value.trim(); if(!v) return; if(allSubsOf(draft).includes(v)) return alert("This name already exists."); draft[c].groups[g].subs.push(v); draw(); });
    m.querySelectorAll("[data-ag]").forEach(b => b.onclick = () => { const c=+b.dataset.ag; const v=m.querySelector(`[data-ng="${c}"]`).value.trim(); if(!v) return; draft[c].groups.push({ name:v, subs:[v] }); draw(); });
    $("#csave").onclick = async () => {
      try { await setDoc(doc(db,"site","config"), { cats: draft, updatedAt: serverTimestamp() }, { merge:true }); S.config = { ...S.config, cats: draft }; toast("Categories saved"); }
      catch (e) { alert("Could not save: " + (e.message || e)); }
    };
  };
  const allSubsOf = d => d.flatMap(c => c.groups.flatMap(g => [g.name, ...g.subs]));
  draw();
}

/* ================= ACCOUNT ================= */
function viewAccount(){
  $("#main").innerHTML = `<div class="card" style="max-width:420px"><h3 style="margin:0 0 4px">Change password</h3><p class="hint">Signed in as ${esc(S.me)}</p>
    <label class="f"><span>Current password</span><input class="i" type="password" id="a1" autocomplete="current-password" autocapitalize="none"></label>
    <label class="f"><span>New password (8+ characters)</span><input class="i" type="password" id="a2" autocomplete="new-password" autocapitalize="none"></label>
    <button class="btn" id="ab">Change password</button><div class="err" id="ae"></div></div>`;
  $("#ab").onclick = async () => {
    const a1=$("#a1").value, a2=$("#a2").value; $("#ae").textContent="";
    if (a2.length < 8) return ($("#ae").textContent = "New password must be at least 8 characters.");
    try { await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(S.me, a1)); await updatePassword(auth.currentUser, a2); toast("Password changed"); $("#a1").value=$("#a2").value=""; }
    catch (e) { $("#ae").textContent = /wrong-password|invalid-credential/.test(e.code||"") ? "Current password is wrong." : "Could not change the password. Try again."; }
  };
}

/* ================= TEAM (owner only) ================= */
async function viewTeam(){
  const m = $("#main"); m.innerHTML = `<div class="card">Loading…</div>`;
  let admins = [];
  try { admins = (await getDocs(collection(db,"admins"))).docs.map(d=>d.id); } catch (e) { m.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
  m.innerHTML = `<div class="card"><h3 style="margin:0 0 8px">People who can edit the website</h3>
    <div>${[SUPER, ...admins].map(e=>`<span class="chip">${esc(e)}${e===SUPER?" (owner)":`<button data-rm="${esc(e)}" title="Remove access">✕</button>`}</span>`).join("")}</div></div>
    <div class="card" style="max-width:460px"><h3 style="margin:0 0 6px">Add a person</h3>
      <p class="hint">Creates their login. Tell them the temporary password on a phone call (not WhatsApp); they can change it under "My account".</p>
      <label class="f"><span>Email</span><input class="i" id="te" type="email" autocapitalize="none"></label>
      <label class="f"><span>Temporary password (8+ characters)</span><input class="i" id="tp" autocapitalize="none" autocorrect="off"></label>
      <button class="btn" id="tb">Add</button><div class="err" id="terr"></div></div>`;
  m.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm(`Remove website access for ${b.dataset.rm}?`)) return;
    await deleteDoc(doc(db,"admins",b.dataset.rm)); toast("Access removed"); viewTeam();
  });
  $("#tb").onclick = async () => {
    const em = $("#te").value.trim().toLowerCase(), pw = $("#tp").value; $("#terr").textContent = "";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return ($("#terr").textContent = "Enter a valid email.");
    if (pw.length < 8) return ($("#terr").textContent = "Temporary password must be at least 8 characters.");
    const app2 = initializeApp(FB, "add-" + Date.now());
    try {
      const a2 = getAuth(app2); if (EMU) connectAuthEmulator(a2, "http://127.0.0.1:9099", { disableWarnings: true });
      try { await createUserWithEmailAndPassword(a2, em, pw); }
      catch (e) { if (e.code !== "auth/email-already-in-use") throw e; toast("This email already had a login — access given; they keep their old password"); }
      await setDoc(doc(db,"admins",em), { addedBy: S.me, at: serverTimestamp() });
      toast("Added"); viewTeam();
    } catch (e) { $("#terr").textContent = e.code === "auth/weak-password" ? "Choose a stronger password." : (e.message || "Could not add."); }
    finally { deleteApp(app2).catch(()=>{}); }
  };
}

/* ================= ONE-TIME IMPORT ================= */
async function importSite(){
  if (!confirm(`Copy ${P.length} products, all website photos and categories into the admin panel?`)) return;
  const b = $("#imp"); b.disabled = true; b.textContent = "Importing…";
  try {
    const batch = writeBatch(db);
    P.forEach((p, i) => {
      const img = (p.img && p.img.length) ? p.img : (PHOTOS[p.id] || []);
      batch.set(doc(db, "products", String(p.id)), { id: p.id, name: p.name, cat: p.cat, sub: p.sub, price: p.price, material: p.material || "Sheesham Wood",
        size: "", desc: "", img, featured: false, hidden: false, order: i, type: p.type || typeFor(p.sub), color: p.color || "#7A4A2C", updatedAt: serverTimestamp() });
    });
    const photos = {}; Object.keys(PHOTOS).filter(k => isNaN(+k)).forEach(k => photos[k] = PHOTOS[k]);
    batch.set(doc(db, "site", "config"), { photos, cats: CATS, customWork: CUSTOM_WORK.map(([src, cap]) => ({ src, cap })), updatedAt: serverTimestamp() });
    await batch.commit();
    await loadAll(); toast("Imported — everything is now editable here"); render();
  } catch (e) { alert("Import failed: " + (e.message || e)); b.disabled = false; b.textContent = "Import current website"; }
}
